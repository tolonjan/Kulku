<style>
/* Layout: phone-first single column (max 560px); sticky search, city hero, destination carousel, day-grouped departure cards, bottom sheets for city / ticket / settings */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --ink:#111C1A; --muted:#5E6E6A; --line:#DCE3E1; --soft:#E6ECEA;
  --train:#0B8A52; --bus:#C4581C; --ship:#1F5DBD; --flight:#7B3FC4; --focus:#1F5DBD;
  --ok:#0B8A52; --warn:#A86A10; --crit:#C42B2B;
  --shadow:0 1px 2px rgba(17,28,26,.06),0 6px 20px rgba(17,28,26,.06);
  --f-display:"Overpass","Segoe UI",system-ui,sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1311; --surface:#151E1C; --ink:#E7EEEC; --muted:#93A4A0; --line:#25322F; --soft:#1C2724;
  --train:#43C98B; --bus:#F28F52; --ship:#78AAFF; --flight:#BE93FF; --focus:#78AAFF; --ok:#43C98B; --warn:#E3A945; --crit:#FF6B6B;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#151E1C; --ink:#E7EEEC; --muted:#93A4A0; --line:#25322F; --soft:#1C2724;
  --train:#43C98B; --bus:#F28F52; --ship:#78AAFF; --flight:#BE93FF; --focus:#78AAFF; --ok:#43C98B; --warn:#E3A945; --crit:#FF6B6B;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ico{width:18px;height:18px;flex:none}
.m-train{color:var(--train)}.m-bus{color:var(--bus)}.m-ship{color:var(--ship)}.m-flight{color:var(--flight)}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:8px 10px;display:flex;flex-direction:column;gap:10px}
.toprow{display:flex;align-items:center;justify-content:space-between}
.word{font-weight:800;font-size:21px;letter-spacing:-.03em;display:flex;align-items:center;gap:6px}
.word i{width:9px;height:9px;border-radius:50%;background:var(--train);box-shadow:12px 0 0 var(--bus),24px 0 0 var(--ship);margin-right:26px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tools{display:flex;gap:8px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:46px;box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:none}
.search input::placeholder{color:var(--muted)}
.search .x{border:0;background:var(--soft);border-radius:50%;width:24px;height:24px;cursor:pointer;color:var(--muted)}

/* hero */
.hero{position:relative;border-radius:22px;overflow:hidden;color:#fff;padding:20px 20px 18px;min-height:270px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:var(--hero)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.38),rgba(0,0,0,.08) 55%,transparent),linear-gradient(0deg,rgba(0,0,0,.35),transparent 45%)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;display:block}
.hero h1,.hero .clock{text-shadow:0 1px 12px rgba(0,0,0,.35)}
.hero .code{position:absolute;left:20px;bottom:76px;font-family:var(--f-mono);font-weight:700;font-size:11px;letter-spacing:.14em;opacity:.7}
.hero .clock{font-family:var(--f-mono);font-size:13px;opacity:.85}
.hero h1{margin:4px 0 0;font-size:clamp(34px,9vw,46px);font-weight:800;letter-spacing:-.02em;line-height:1;text-wrap:balance}
.citypill{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;border-radius:999px;padding:8px 14px 8px 12px;font-weight:700}
.citypill small{font-family:var(--f-mono);opacity:.75;font-weight:500}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{display:inline-flex;align-items:center;gap:6px;background:rgba(8,14,13,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600}
.stat{padding:4px 11px 4px 4px;gap:7px}
.stat .sic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff}
.stat .sic .ico{width:15px;height:15px}
.sic-train{background:#0B8A52}.sic-bus{background:#D0611F}.sic-ship{background:#2E6BD1}.sic-flight{background:#8448D0}
.stat b{font-family:var(--f-mono)}
.stat em{font-style:normal;font-weight:400;opacity:.75}

/* sections */
h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.sec{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.count{font-family:var(--f-mono);color:var(--muted);font-size:13px}

/* carousel */
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin-inline:-4px;padding-inline:4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.dest{scroll-snap-align:start;flex:0 0 152px;height:150px;border:0;border-radius:18px;padding:14px;color:#fff;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;background:var(--card);position:relative;overflow:hidden}
.dest::after{content:"";position:absolute;inset:auto -30% -40% auto;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
.dest[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.dest .nm{font-weight:800;font-size:18px;line-height:1.1;overflow-wrap:anywhere}
.dest .md{display:flex;gap:4px;opacity:.9}
.dest .md .ico{width:15px;height:15px}
.dest .nx{font-size:11.5px;opacity:.8}
.dest .nt{font-family:var(--f-mono);font-weight:700;font-size:22px;line-height:1}
.dest .cn{position:absolute;right:12px;top:14px;font-size:11px;opacity:.85;background:rgba(0,0,0,.2);border-radius:999px;padding:2px 8px}

/* controls */
.controls{display:flex;flex-direction:column;gap:10px}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scroller::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.pill[aria-pressed="true"] .ico{color:var(--surface)}
.pill .n{font-family:var(--f-mono);font-size:12px;opacity:.7}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 12px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
input[type=date]{font:inherit;font-size:14px;padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

/* list */
.day{display:flex;flex-direction:column;gap:2px;padding-left:12px;border-left:3px solid var(--ship);margin-top:4px}
.day b{font-size:16px}
.day span{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:76px minmax(0,1fr) auto;grid-template-areas:"t d s" "f f f";gap:4px 12px;align-items:center;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px 12px;cursor:pointer;box-shadow:var(--shadow);width:100%}
.card:hover{border-color:var(--muted)}
.card.gone{opacity:.55}
.c-time{grid-area:t;display:flex;flex-direction:column}
.tm{font-family:var(--f-mono);font-weight:700;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.tm.late{color:var(--warn)}
.old{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-decoration:line-through}
.ln{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-main{grid-area:d;min-width:0}
.c-dest{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;min-width:0}
.c-dest span{overflow-wrap:anywhere}
.c-sub{font-size:12.5px;color:var(--muted);margin-left:26px}
.c-side{grid-area:s;text-align:right;font-size:12.5px;color:var(--muted)}
.c-side b{display:block;color:var(--ink);font-size:14px}
.c-foot{grid-area:f;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:12.5px;color:var(--muted)}
.status{font-weight:700;display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-ok{color:var(--ok)}.st-warn{color:var(--warn)}.st-crit{color:var(--crit)}.st-mut{color:var(--muted)}
.card.cx .c-dest span{text-decoration:line-through}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:28px 18px;text-align:center;color:var(--muted)}
.more{align-self:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer}
.banner{background:var(--soft);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--muted)}
.banner b{color:var(--ink)}
footer{font-size:12px;color:var(--muted);line-height:1.6;text-align:center}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,10,9,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.5}}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.shead{display:flex;align-items:center;justify-content:center;position:relative;min-height:36px}
.shead b{font-size:16px}
.close{position:absolute;right:0;border:0;background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}
.box{background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.route .pt b{display:block;font-size:22px;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.route .pt span{font-size:12px;color:var(--muted)}
.route .pt:last-child{text-align:right}
.oprow{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.oprow b{display:block}
.oprow span{font-size:12.5px;color:var(--muted)}
.qtitle{font-weight:800;font-size:16px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--surface);width:100%;font-weight:600;text-align:left}
.opt[aria-checked="true"]{border-color:var(--ship);background:color-mix(in srgb,var(--ship) 10%,var(--surface))}
.opt .rad{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.opt[aria-checked="true"] .rad{border-color:var(--ship);background:var(--ship)}
.opt[aria-checked="true"] .rad::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--surface)}
.stepper{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted)}
.stepper div{display:flex;align-items:center;gap:12px}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;cursor:pointer}
.stepper output{font-family:var(--f-mono);font-weight:700;color:var(--ink);min-width:16px;text-align:center}
.cta{display:flex;align-items:center;justify-content:space-between;background:var(--ship);color:#fff;text-decoration:none;font-weight:700;border-radius:14px;padding:15px 18px;font-size:15.5px}
.cta.off{background:var(--soft);color:var(--muted);pointer-events:none}
.fine{font-size:12px;color:var(--muted);text-align:center}
.citylist{display:flex;flex-direction:column;gap:6px}
.cityopt{display:flex;align-items:center;justify-content:space-between;border:0;background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;font-weight:600;width:100%;text-align:left}
.cityopt small{font-family:var(--f-mono);color:var(--muted);font-weight:500}
.cityopt[aria-current="true"]{outline:2px solid var(--ship)}
.cityopt .mds{display:flex;gap:4px;align-items:center}
.keyrow{display:flex;flex-direction:column;gap:8px}
.keyrow input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.keyrow button{border:0;background:var(--ink);color:var(--surface);border-radius:10px;padding:11px;font-weight:700;cursor:pointer}
.srcrow{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.srcrow:first-child{border-top:0}
</style>

<script>

let stationNames=null;
async function stations(){
  if(stationNames)return stationNames;
  const j=await getJSON('https://rata.digitraffic.fi/api/v1/metadata/stations');
  stationNames={};j.forEach(s=>stationNames[s.stationShortCode]=s.stationName.replace(/ asema$/,'').replace(/_/g,' '));
  return stationNames;
}
async function liveTrains(c){
  const url=isToday()
    ?`https://rata.digitraffic.fi/api/v1/live-trains/station/${c.st}?arrived_trains=0&arriving_trains=60&departed_trains=0&departing_trains=60&include_nonstopping=false`
    :`https://rata.digitraffic.fi/api/v1/trains/${state.date}`;
  const [names,trains]=await Promise.all([stations(),getJSON(url)]);
  const out=[];
  for(const t of trains){
    if(!['Long-distance','Commuter'].includes(t.trainCategory))continue;
    const rows=t.timeTableRows||[];
    for(const type of ['DEPARTURE','ARRIVAL']){
      const r=rows.find(x=>x.stationShortCode===c.st&&x.type===type&&x.trainStopping!==false&&x.commercialStop!==false);
      if(!r)continue;
      const dir=type==='DEPARTURE'?'dep':'arr';
      const other=dir==='dep'?rows[rows.length-1].stationShortCode:rows[0].stationShortCode;
      if(other===c.st)continue;
      const sched=new Date(r.scheduledTime);
      const est=r.actualTime?new Date(r.actualTime):(r.liveEstimateTime?new Date(r.liveEstimateTime):null);
      if(!inDay(sched,10))continue;
      out.push({mode:'train',dir,sched,est,done:!!r.actualTime,cx:!!(r.cancelled||t.cancelled),
        line:t.commuterLineID?`${t.commuterLineID}-juna`:`${t.trainType} ${t.trainNumber}`,place:names[other]||other,code:other,
        where:r.commercialTrack?['Raide',r.commercialTrack]:null,op:'VR'});
    }
  }
  return out;
}

async function liveShips(c){

  const list=Array.isArray(j)?j:(j.portCalls||[]);const out=[];const seen=new Set();
  for(const pc of list){
    for(const d of (pc.portAreaDetails||[])){
      for(const dir of ['arr','dep']){
        const s=dir==='arr'?(d.eta||d.etaTimestamp):(d.etd||d.etdTimestamp);
        const a=dir==='arr'?(d.ata||d.ataTimestamp):(d.atd||d.atdTimestamp);
        const base=a||s;if(!base)continue;
        const key=pc.portCallId+dir;if(seen.has(key))continue;

        const p=dir==='dep'?pc.nextPort:pc.prevPort;
        const pass=pc.vesselTypeCode>=60&&pc.vesselTypeCode<=69;
        out.push({mode:'ship',dir,sched:new Date(s||a),est:a?new Date(a):null,done:!!a,cx:false,
          line:pc.vesselName||'Alus',place:PORTS[p]||p||'—',code:p,cc:p?p.slice(0,2):'',
          where:d.berthName?['Laituri',d.berthName]:(d.portAreaName?['Alue',d.portAreaName]:null),
          op:shipOp(pc.vesselName)||(pass?'Matkustaja-alus':'Rahtialus'),passenger:pass||!!shipOp(pc.vesselName),ship:true});
      }

  }
  return out;
}

async function liveBuses(c){
  const pb=proxyBase();
  if(!state.key&&pb===null)throw new Error('nokey');
  const start=isToday()?Math.floor(Date.now()/1000):Math.floor(helAt(state.date,5)/1000);
  const q=`{stopsByRadius(lat:${c.lat},lon:${c.lon},radius:700,first:25){edges{node{distance stop{name code platformCode stoptimesWithoutPatterns(startTime:${start},timeRange:86400,numberOfDepartures:8){scheduledDeparture realtimeDeparture realtime serviceDay headsign trip{route{shortName mode agency{name}}}}}}}}}`;
  let j=null;
  if(pb!==null){try{j=await getJSON(`${pb}/api/digitransit?router=${c.r}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})})}catch(e){if(!state.key)throw new Error('välipalvelin: '+e.message)}}
  if(!j)j=await getJSON(`https://api.digitransit.fi/routing/v2/${c.r}/gtfs/v1`,{method:'POST',headers:{'Content-Type':'application/json','digitransit-subscription-key':state.key},body:JSON.stringify({query:q})});
  const out=[];const seen=new Set();
  for(const e of (j.data?.stopsByRadius?.edges||[])){
    const s=e.node.stop;
    for(const st of (s.stoptimesWithoutPatterns||[])){
      if(st.trip?.route?.mode!=='BUS')continue;
      const sched=new Date((st.serviceDay+st.scheduledDeparture)*1000);
      const est=st.realtime?new Date((st.serviceDay+st.realtimeDeparture)*1000):null;
      const k=st.trip.route.shortName+st.headsign+sched.getTime();if(seen.has(k))continue;seen.add(k);
      if(!inDay(sched,2))continue;
      out.push({mode:'bus',dir:'dep',sched,est,done:false,cx:false,line:'Linja '+(st.trip.route.shortName||'—'),place:st.headsign||'—',
        where:['Pysäkki',s.name+(s.platformCode?' '+s.platformCode:'')],op:st.trip.route.agency?.name||(c.r==='hsl'?'HSL':'Waltti')});
    }
  }
  return out;
}

async function finaviaText(dir,apt){

  if(pb!==null){try{const r=await fetch(`${pb}/api/flights?dir=${dir}&apt=${apt}`);if(r.ok)return await r.text();let m='HTTP '+r.status;try{m=(await r.json()).error||m}catch(e){}errs.push('välipalvelin: '+m)}catch(e){errs.push('välipalvelin: ei yhteyttä')}

  const tries=[
    [`https://api.finavia.fi/flights/public/v0/flights/${dir}/${apt}?subscription-key=${k}`,{}],

let loading=false;
async function load(){
  if(loading)return;loading=true;$('btn-refresh').classList.add('spin');
  const c=city();
  const jobs={train:liveTrains(c),bus:liveBuses(c),ship:c.port?liveShips(c):Promise.reject(new Error('none')),flight:c.apt?liveFlights(c):Promise.reject(new Error('none'))};
  const res=await Promise.allSettled(Object.values(jobs));
  const items=[];const status={};state.errors={};
  Object.keys(jobs).forEach((m,i)=>{
    const r=res[i];
    if(r.status==='fulfilled'){items.push(...r.value);status[m]='live'}
    else if(!hasMode(c,m))status[m]='none';
    else{items.push(...sample(c,m));status[m]=r.reason?.message==='nokey'?'nokey':'demo';if(status[m]==='demo')state.errors[m]=r.reason?.message||String(r.reason)}
  });
  state.items=items.filter(x=>dayKey(x.sched)===state.date);state.status=status;state.updated=new Date();
  loading=false;$('btn-refresh').classList.remove('spin');
  render();
}

function statusOf(x){
  const diff=x.est?Math.round((x.est-x.sched)/60e3):0;
  if(x.cx)return ['crit','Peruttu'];
  if(x.done)return ['mut',x.dir==='dep'?'Lähtenyt':'Saapunut'];
  if(x.ship)return ['mut',x.dir==='dep'?'Arvioitu lähtö':'Arvioitu saapuminen'];
  if(x.mode==='flight'&&x.remark&&!x.est)return ['mut',x.remark];
  if(x.est&&diff>=2)return ['warn',`Myöhässä ${diff} min`];
  if(x.est)return ['ok','Ajallaan'];
  return ['mut','Aikataulun mukaan'];
}
function visible(){

  const html=`
   <div class="box">
     <div class="route"><div class="pt"><b>${esc(from.c||from.n)}</b><span>${esc(from.n)}</span></div><span class="m-${x.mode}">${ICONS[x.mode]}</span><div class="pt"><b>${esc(to.c||to.n)}</b><span>${esc(to.n)}</span></div></div>
     <div class="oprow"><span class="m-${x.mode}">${ICONS[x.mode]}</span><div><b>${esc(x.op||MODE_FI[x.mode])}</b><span>${esc(x.line)} · ${fmt(x.est||x.sched)} · ${dayShort(state.date)}</span></div></div>
   </div>
   <div class="box"><div class="qtitle">Minkälainen matka?</div>
     <button class="opt" data-k="trip" data-v="one" role="radio" aria-checked="true">→ Vain meno<span class="rad"></span></button>
     <button class="opt" data-k="trip" data-v="ret" role="radio" aria-checked="false">⇄ Meno-paluu<span class="rad"></span></button></div>
   <div class="box"><div class="qtitle">Keitä matkustaa?</div>
     <button class="opt" data-k="who" data-v="me" role="radio" aria-checked="true">Minä<span class="rad"></span></button>
     <button class="opt" data-k="who" data-v="many" role="radio" aria-checked="false">Meitä on useampi<span class="rad"></span></button>
     <div class="stepper"><span>Matkustajia yhteensä</span><div><button id="minus" aria-label="Vähemmän" hidden>−</button><output id="pax">1</output><button id="plus" aria-label="Enemmän" hidden>+</button></div></div></div>
   ${bookable?`<a class="cta" href="${link}" target="_blank" rel="noopener">${x.mode==='flight'?'Jatka lentohakuun':'Jatka lippukauppaan'}: ${esc(x.op)}<span>›</span></a>`:`<span class="cta off">${x.ship?'Rahtialus, ei matkustajalippuja':'Lippukauppaa ei ole liitetty'}</span>`}
   <div class="fine">Varauspalvelut lisätään seuraavassa vaiheessa. Nyt linkki avaa operaattorin oman lippukaupan.</div>`;
  openSheet('Lipunhaku',html,()=>{
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      t[b.dataset.k]=b.dataset.v;
      document.querySelectorAll(`.opt[data-k="${b.dataset.k}"]`).forEach(o=>o.setAttribute('aria-checked',o===b));
      if(b.dataset.k==='who'){t.n=t.who==='me'?1:Math.max(2,t.n);$('pax').textContent=t.n;$('minus').hidden=$('plus').hidden=t.who==='me'}
    });
    $('plus').onclick=()=>{t.n=Math.min(9,t.n+1);$('pax').textContent=t.n};
    $('minus').onclick=()=>{t.n=Math.max(2,t.n-1);$('pax').textContent=t.n};
  });
}
function citySheet(){
  const html=`<div class="citylist">${CITIES.map(c=>`<button class="cityopt" data-st="${c.st}" aria-current="${c.st===state.city}"><span>${c.n} <small>${c.st}</small></span><span class="mds"><span class="m-train">${ICONS.train}</span><span class="m-bus">${ICONS.bus}</span>${c.port?`<span class="m-ship">${ICONS.ship}</span>`:''}${c.apt?`<span class="m-flight">${ICONS.flight}</span>`:''}</span></button>`).join('')}</div>`;
  openSheet('Valitse kaupunki',html,close=>{
    document.querySelectorAll('.cityopt').forEach(b=>b.onclick=()=>{state.city=b.dataset.st;store.set('lahto.city',state.city);state.mode='all';state.q='';$('q').value='';$('qclear').hidden=true;state.limit=30;close();window.scrollTo({top:0});load()});
  });
}
function settingsSheet(){
  const lab={live:'Live',demo:'Esimerkkidata',nokey:'Esimerkkidata, avain puuttuu',none:'Ei tässä kaupungissa'};
  const html=`<div class="box">${MODES.map(m=>`<div class="srcrow"><span class="m-${m}" style="display:flex;gap:8px;align-items:center">${ICONS[m]}<span style="color:var(--ink)">${MODE_PL[m]}</span></span><span>${lab[state.status[m]]||'—'}</span></div>${state.errors?.[m]?`<div class="fine" style="text-align:left;color:var(--crit)">${esc(state.errors[m])}</div>`:''}`).join('')}
    <div class="fine" style="text-align:left">Päivitetty ${state.updated?fmt(state.updated):'—'}</div></div>
   <div class="box keyrow"><div class="qtitle">Bussien live-data</div>
     <span class="fine" style="text-align:left">Paikallisbussien reaaliaikatiedot tulevat Digitransitista. Ilmaisen avaimen saa osoitteesta portal-api.digitransit.fi. Avain tallentuu vain tähän selaimeen.</span>
     <input id="dtkey" type="password" autocomplete="off" placeholder="digitransit-subscription-key" value="${esc(state.key)}">
     <div class="qtitle" style="margin-top:6px">Lentojen live-data</div>
     <span class="fine" style="text-align:left">Lentotiedot tulevat Finavian rajapinnasta. Avaimen saa ilmaiseksi osoitteesta apiportal.finavia.fi: rekisteröidy, tilaa Flights-tuote ja kopioi Profile-sivulta Primary key. app_id täytetään vain, jos portaali antaa sellaisen.</span>
     <input id="fid" type="text" autocomplete="off" placeholder="app_id (valinnainen)" value="${esc(state.fid)}">
     <input id="fkey" type="password" autocomplete="off" placeholder="Primary key / app_key" value="${esc(state.fkey)}">
     <div class="qtitle" style="margin-top:6px">Välipalvelin</div>
     <span class="fine" style="text-align:left">Kun Kulku on julkaistu Verceliin, avaimet ovat palvelimella eikä niitä tarvitse syöttää tähän. Omalta koneelta ajaessa voit antaa palvelimen osoitteen, esimerkiksi https://kulku.app.</span>
     <input id="proxy" type="url" autocomplete="off" placeholder="https://kulku.app" value="${esc(state.proxy)}">
     <button id="savekey">Tallenna ja päivitä</button></div>`;
  openSheet('Asetukset ja tietolähteet',html,close=>{$('savekey').onclick=()=>{state.key=$('dtkey').value.trim();store.set('lahto.dtkey',state.key);state.proxy=$('proxy').value.trim();store.set('lahto.proxy',state.proxy);state.fid=$('fid').value.trim();state.fkey=$('fkey').value.trim();store.set('lahto.fid',state.fid);store.set('lahto.fkey',state.fkey);close();load()}});
}

/* ---------- Ohjaimet ---------- */
$('btn-city').onclick=citySheet;
$('btn-settings').onclick=settingsSheet;
$('btn-refresh').onclick=()=>load();
$('q').addEventListener('input',e=>{state.q=e.target.value;$('qclear').hidden=!state.q;state.limit=30;renderRail();renderList()});
$('qclear').onclick=e=>{e.preventDefault();state.q='';$('q').value='';$('qclear').hidden=true;renderRail();renderList()};
$('rail').addEventListener('click',e=>{const b=e.target.closest('.dest');if(!b)return;
  state.q=state.q===b.dataset.place?'':b.dataset.place;$('q').value=state.q;$('qclear').hidden=!state.q;renderRail();renderList();
  if(state.q)$('listsec').scrollIntoView({block:'start'})});
$('modes').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.mode=b.dataset.m;state.limit=30;renderRail();renderModes();renderList()});
['dep','arr'].forEach(d=>$('d-'+d).onclick=()=>{state.dir=d;$('d-dep').setAttribute('aria-pressed',d==='dep');$('d-arr').setAttribute('aria-pressed',d==='arr');state.limit=30;render()});
$('list').addEventListener('click',e=>{
  if(e.target.id==='more'){state.limit+=30;renderList();return}
  const c=e.target.closest('.card');if(c)ticketSheet(shown[+c.dataset.i])});
function setDay(key,which){
  state.date=key;state.limit=30;
  [['today','day-today'],['tomorrow','day-tomorrow'],['pick','day-pick']].forEach(([w,id])=>$(id).setAttribute('aria-pressed',w===which));
  $('day-pick-label').textContent=which==='pick'?dayShort(key):'Valitse päivä';
  if(which!=='pick')$('daypicker').hidden=true;
  load();
}
$('day-today').onclick=()=>setDay(todayKey(),'today');
$('day-tomorrow').onclick=()=>setDay(addDays(todayKey(),1),'tomorrow');
$('day-pick').onclick=()=>{const p=$('daypicker');p.min=todayKey();p.max=addDays(todayKey(),60);if(!p.value)p.value=addDays(todayKey(),2);
  p.hidden=false;try{p.showPicker()}catch(e){p.focus()}};
$('daypicker').addEventListener('change',e=>{const v=e.target.value;if(!v)return;
  if(v===todayKey())setDay(v,'today');else if(v===addDays(todayKey(),1))setDay(v,'tomorrow');else setDay(v,'pick')});
setInterval(()=>{$('h-clock').textContent=(isToday()?'Tänään':dayShort(state.date))+' · '+fmt(new Date())},15e3);
setInterval(()=>{if(isToday())load()},60e3);
renderHero();load();
</script>
